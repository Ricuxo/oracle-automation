---
- name: oraswdb-install | Validar variaveis obrigatorias
  ansible.builtin.assert:
    that:
      - oracle_db_version is defined
      - oracle_db_zip_files is defined
      - oracle_db_zip_files | length > 0
    fail_msg: "oracle_db_version e oracle_db_zip_files devem ser definidos no group_vars"

- name: oraswdb-install | Criar oracle_home directory
  ansible.builtin.file:
    path: "{{ oracle_db_home }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'
    state: directory

- name: oraswdb-install | Criar diretório de response files
  ansible.builtin.file:
    path: "{{ oracle_rsp_stage }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'
    state: directory

- name: oraswdb-install | Transferir binários do Oracle Database
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/binarios/{{ item }}"
    dest: "{{ oracle_stage }}/{{ item }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
  loop: "{{ oracle_db_zip_files }}"

- name: oraswdb-install | Descompactar binários do Oracle Database
  ansible.builtin.unarchive:
    src: "{{ oracle_stage }}/{{ item }}"
    dest: "{{ oracle_db_home }}"
    remote_src: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
  loop: "{{ oracle_db_zip_files }}"

- name: oraswdb-install | Gerar response file
  ansible.builtin.template:
    src: db_install.rsp.j2
    dest: "{{ oracle_db_responseFile }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'

- name: oraswdb-install | Executar instalação Oracle Database
  ansible.builtin.shell: |
    {{ oracle_db_home }}/runInstaller -silent \
    -responseFile {{ oracle_db_responseFile }} \
    -ignorePrereqFailure \
    -waitforcompletion \
    2>&1 | tee {{ oracle_stage }}/db_install.log
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_BASE: "{{ oracle_base }}"
    TMP: "{{ oracle_tmp_dir | default('/u01/tmp') }}"
    TMPDIR: "{{ oracle_tmp_dir | default('/u01/tmp') }}"
  register: db_install
  failed_when:
    - db_install.rc != 0
    - "'Successfully Setup Software' not in db_install.stdout"

- name: oraswdb-install | Executar orainstRoot.sh
  ansible.builtin.shell: "{{ oracle_inventory }}/orainstRoot.sh"
  when: "'orainstRoot.sh' in db_install.stdout"

- name: oraswdb-install | Executar root.sh
  ansible.builtin.shell: "{{ oracle_db_home }}/root.sh"

---
# Usuário e grupos Oracle
oracle_user: oracle
oracle_user_uid: 54321
oracle_group: oinstall
oracle_group_gid: 54321

oracle_groups:
  - { group: oinstall,  gid: 54321 }
  - { group: dba,       gid: 54322 }
  - { group: oper,      gid: 54323 }
  - { group: backupdba, gid: 54324 }
  - { group: dgdba,     gid: 54325 }
  - { group: kmdba,     gid: 54326 }
  - { group: asmdba,    gid: 54327 }
  - { group: asmoper,   gid: 54328 }
  - { group: asmadmin,  gid: 54329 }

# Diretórios Oracle
oracle_base: /u01/app/oracle
oracle_inventory: /u01/app/oraInventory
oracle_stage: /u01/stage

oracle_directories:
  - { path: "{{ oracle_tmp_dir }}", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '1777' }
  - { path: "{{ oracle_base }}",      owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0755' }
  - { path: "{{ oracle_inventory }}", owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0755' }
  - { path: "{{ oracle_stage }}",     owner: "{{ oracle_user }}", group: "{{ oracle_group }}", mode: '0755' }

# Parâmetros de kernel (sysctl)
oracle_sysctl:
  - { name: kernel.shmall,                    value: 1073741824 }
  - { name: kernel.shmmax,                    value: 4398046511104 }
  - { name: kernel.shmmni,                    value: 4096 }
  - { name: kernel.sem,                       value: "250 32000 100 128" }
  - { name: kernel.panic_on_oops,             value: 1 }
  - { name: net.ipv4.ip_local_port_range,     value: "9000 65500" }
  - { name: net.ipv4.conf.all.rp_filter,      value: 2 }
  - { name: net.ipv4.conf.default.rp_filter,  value: 2 }
  - { name: net.core.rmem_default,            value: 262144 }
  - { name: net.core.rmem_max,                value: 4194304 }
  - { name: net.core.wmem_default,            value: 262144 }
  - { name: net.core.wmem_max,                value: 1048576 }
  - { name: fs.aio-max-nr,                    value: 1048576 }
  - { name: fs.file-max,                      value: 6815744 }
  - { name: vm.swappiness,                    value: 10 }

# Limits do Oracle
oracle_limits:
  - { domain: "{{ oracle_user }}", type: soft, item: nofile,   value: 1024      }
  - { domain: "{{ oracle_user }}", type: hard, item: nofile,   value: 65536     }
  - { domain: "{{ oracle_user }}", type: soft, item: nproc,    value: 16384     }
  - { domain: "{{ oracle_user }}", type: hard, item: nproc,    value: 16384     }
  - { domain: "{{ oracle_user }}", type: soft, item: stack,    value: 10240     }
  - { domain: "{{ oracle_user }}", type: hard, item: stack,    value: 32768     }
  - { domain: "{{ oracle_user }}", type: soft, item: memlock,  value: 134217728 }
  - { domain: "{{ oracle_user }}", type: hard, item: memlock,  value: 134217728 }
  - { domain: "{{ oracle_user }}", type: soft, item: data,     value: unlimited }
  - { domain: "{{ oracle_user }}", type: hard, item: data,     value: unlimited }

# Hugepages (% da RAM total)
hugepages_percent: 50

# Transparent Hugepages
disable_thp: true

# Usar oracle-database-preinstall-19c como base (recomendado Oracle)
# Resolve automaticamente todas as dependências incluindo libaio-devel, glibc-static workarounds, etc.
use_preinstall_rpm: true

# Pacotes complementares OL8 - instalados além do preinstall RPM
oracle_packages_ol8:
  - compat-openssl10
  - libvirt-libs
  - nfs-utils
  - net-tools

# Pacotes complementares OL9 - instalados além do preinstall RPM
oracle_packages_ol9:
  - compat-openssl11
  - libvirt-libs
  - nfs-utils
  - net-tools
  - libnsl2
  - librdmacm

# Lista final resolvida por versão do OS
oracle_packages: "{{ oracle_packages_ol8 if ansible_distribution_major_version == '8' else oracle_packages_ol9 if ansible_distribution_major_version == '9' else [] }}"

# Storage /u01
oracle_disk_u01: /dev/sdb
oracle_disk_u01_fstype: xfs
oracle_disk_u01_mount: /u01
oracle_disk_u01_mount_opts: defaults,noatime
configure_u01_disk: true

# Swap
configure_swap: true
swap_file_path: /swapfile
# Tamanho baseado na recomendação Oracle:
# RAM <= 16GB -> swap = RAM
# RAM > 16GB  -> swap = 16GB
swap_size_mb: "{{ [ansible_memtotal_mb, 16384] | min }}"

# Diretório temporário para instalação Oracle
oracle_tmp_dir: /u01/tmp

# CV_ASSUME_DISTID: necessário para instalar Oracle < 19.7 em OL8/OL9
# O instalador 19.3 base não certifica OL8/OL9 nativamente
cv_assume_distid: "{% if ansible_distribution_major_version | int >= 8 %}OEL7.8{% endif %}"

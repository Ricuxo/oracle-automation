---
- name: orahost | swap | Verificar swap atual
  ansible.builtin.command: swapon --show
  register: swap_current
  changed_when: false

- name: orahost | swap | Criar arquivo de swap
  ansible.builtin.command: dd if=/dev/zero of={{ swap_file_path }} bs=1M count={{ swap_size_mb }}
  when: swap_file_path not in swap_current.stdout
  register: swap_create

- name: orahost | swap | Definir permissões do arquivo de swap
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: '0600'
  when: swap_file_path not in swap_current.stdout

- name: orahost | swap | Formatar arquivo de swap
  ansible.builtin.command: mkswap {{ swap_file_path }}
  when: swap_file_path not in swap_current.stdout

- name: orahost | swap | Ativar swap
  ansible.builtin.command: swapon {{ swap_file_path }}
  when: swap_file_path not in swap_current.stdout

- name: orahost | swap | Persistir swap no fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ swap_file_path }} none swap sw 0 0"
    state: present
    backup: true

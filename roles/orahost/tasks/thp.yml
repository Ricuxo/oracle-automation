---
# Oracle recomenda 'madvise' para UEK7+ (OL8/OL9)
# 'never' para kernels antigos (OL7)
- name: orahost | thp | Definir valor recomendado de THP por versão de OS
  ansible.builtin.set_fact:
    thp_value: "{{ 'madvise' if ansible_distribution_major_version | int >= 8 else 'never' }}"

- name: orahost | thp | Desabilitar THP - enabled
  ansible.builtin.shell: |
    echo {{ thp_value }} > /sys/kernel/mm/transparent_hugepage/enabled
  changed_when: false

- name: orahost | thp | Desabilitar THP - defrag
  ansible.builtin.shell: |
    echo {{ thp_value }} > /sys/kernel/mm/transparent_hugepage/defrag
  changed_when: false

- name: orahost | thp | Persistir configuracao do THP via rc.local
  ansible.builtin.blockinfile:
    path: /etc/rc.local
    block: |
      # Configuracao Transparent Hugepages - Oracle
      echo {{ thp_value }} > /sys/kernel/mm/transparent_hugepage/enabled
      echo {{ thp_value }} > /sys/kernel/mm/transparent_hugepage/defrag
    marker: "# {mark} ANSIBLE MANAGED - THP"
    create: true
    mode: '0755'

- name: orahost | thp | Garantir rc.local executavel
  ansible.builtin.file:
    path: /etc/rc.local
    mode: '0755'

---
- name: oraswgi-install | Validar variaveis obrigatorias
  ansible.builtin.assert:
    that:
      - oracle_gi_version is defined
      - oracle_gi_zip_files is defined
      - oracle_gi_zip_files | length > 0
    fail_msg: "oracle_gi_version e oracle_gi_zip_files devem ser definidos no group_vars"

- name: oraswgi-install | Validar swap
  ansible.builtin.assert:
    that:
      - ansible_swaptotal_mb >= 2048
    fail_msg: "Swap insuficiente: {{ ansible_swaptotal_mb }}MB. Minimo recomendado: 2048MB"
    success_msg: "Swap ok: {{ ansible_swaptotal_mb }}MB"
  ignore_errors: true

- name: oraswgi-install | Verificar se GI ja esta instalado no oraInventory
  ansible.builtin.shell: |
    grep -c "{{ oracle_home_gi }}" {{ oracle_inventory }}/ContentsXML/inventory.xml 2>/dev/null && echo "found" || echo "0"
  register: checkgiinstall
  changed_when: false
  failed_when: false

- name: oraswgi-install | Verificar se root.sh ja foi executado
  ansible.builtin.stat:
    path: /etc/oracle/olr.loc
  register: olrloc

- name: oraswgi-install | Criar oracle_home_gi
  ansible.builtin.file:
    path: "{{ oracle_home_gi }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'
    state: directory

- name: oraswgi-install | Criar oracle_base_gi
  ansible.builtin.file:
    path: "{{ oracle_base_gi }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'
    state: directory

- name: oraswgi-install | Criar diretório de response files
  ansible.builtin.file:
    path: "{{ oracle_rsp_stage }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'
    state: directory

- name: oraswgi-install | Transferir binários do GI
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/binarios/{{ item }}"
    dest: "{{ oracle_stage }}/{{ item }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
  loop: "{{ oracle_gi_zip_files }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Descompactar binários do GI
  ansible.builtin.unarchive:
    src: "{{ oracle_stage }}/{{ item }}"
    dest: "{{ oracle_home_gi }}"
    remote_src: true
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    creates: "{{ oracle_home_gi }}/root.sh"
  loop: "{{ oracle_gi_zip_files }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Copiar template oficial do response file
  ansible.builtin.copy:
    src: "{{ oracle_home_gi }}/install/response/gridsetup.rsp"
    dest: "{{ oracle_gi_responseFile }}"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0640'
    remote_src: true
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - ORACLE_BASE
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^ORACLE_BASE='
    line: "ORACLE_BASE={{ oracle_base_gi }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - ORACLE_HOME
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^ORACLE_HOME='
    line: "ORACLE_HOME={{ oracle_home_gi }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - opcao instalacao
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.option='
    line: "oracle.install.option={% if configure_cluster | bool %}CRS_CONFIG{% else %}HA_CONFIG{% endif %}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - OSDBA
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.OSDBA='
    line: "oracle.install.asm.OSDBA=asmdba"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - OSOPER
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.OSOPER='
    line: "oracle.install.asm.OSOPER=asmoper"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - OSASM
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.OSASM='
    line: "oracle.install.asm.OSASM=asmadmin"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - diskgroup name
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.diskGroup\.name='
    line: "oracle.install.asm.diskGroup.name={{ oracle_asm_init_dg }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - redundancy
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.diskGroup\.redundancy='
    line: "oracle.install.asm.diskGroup.redundancy={{ oracle_asm_diskgroups | selectattr('diskgroup', 'equalto', oracle_asm_init_dg) | map(attribute='properties') | flatten | map(attribute='redundancy') | first }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - AUSize
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.diskGroup\.AUSize='
    line: "oracle.install.asm.diskGroup.AUSize={{ oracle_asm_diskgroups | selectattr('diskgroup', 'equalto', oracle_asm_init_dg) | map(attribute='properties') | flatten | map(attribute='ausize') | first }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - discos
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.diskGroup\.disks='
    line: "oracle.install.asm.diskGroup.disks={{ oracle_asm_diskgroups | selectattr('diskgroup', 'equalto', oracle_asm_init_dg) | map(attribute='disk') | flatten | map(attribute='asmlabel') | map('regex_replace', '^', 'ORCL:') | join(',') }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - diskDiscoveryString
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.diskGroup\.diskDiscoveryString='
    line: "oracle.install.asm.diskGroup.diskDiscoveryString=ORCL:*"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - monitorPassword
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.monitorPassword='
    line: "oracle.install.asm.monitorPassword={{ vault_sys_password }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Configurar response file - SYSASMPassword
  ansible.builtin.lineinfile:
    path: "{{ oracle_gi_responseFile }}"
    regexp: '^oracle\.install\.asm\.SYSASMPassword='
    line: "oracle.install.asm.SYSASMPassword={{ vault_sys_password }}"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Executar instalação do GI
  ansible.builtin.shell: |
    {{ oracle_home_gi }}/gridSetup.sh -silent \
    -responseFile {{ oracle_gi_responseFile }} \
    -ignorePrereqFailure \
    -waitforcompletion \
    2>&1 | tee {{ oracle_stage }}/gi_install.log
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_BASE: "{{ oracle_base }}"
    CV_ASSUME_DISTID: "{{ cv_assume_distid | default('') }}"
    TMP: "{{ oracle_tmp_dir | default('/u01/tmp') }}"
    TMPDIR: "{{ oracle_tmp_dir | default('/u01/tmp') }}"
  register: gi_install
  failed_when:
    - gi_install.rc != 0
    - "'Successfully Setup Software' not in gi_install.stdout"
  when: '"found" not in checkgiinstall.stdout'

- name: oraswgi-install | Executar orainstRoot.sh
  ansible.builtin.shell: "{{ oracle_inventory }}/orainstRoot.sh"
  when:
    - not olrloc.stat.exists
    - gi_install.stdout is defined
    - "'orainstRoot.sh' in gi_install.stdout"





- name: oraswgi-install | Criar GRID_BASE
  ansible.builtin.shell: |
    GRID_BASE=$(grep "rootmacro" {{ oracle_home_gi }}/root.sh | grep -oP '/[^ ]*(?=/install)' | head -1)
    mkdir -p ${GRID_BASE}/install/utl
    chown -R {{ oracle_user }}:{{ oracle_group }} ${GRID_BASE}
  args:
    executable: /bin/bash
  when: not olrloc.stat.exists

- name: oraswgi-install | Executar root.sh
  ansible.builtin.shell: "{{ oracle_home_gi }}/root.sh"
  when: not olrloc.stat.exists

- name: oraswgi-install | Executar gridSetup.sh -executeConfigTools
  ansible.builtin.shell: |
    {{ oracle_home_gi }}/gridSetup.sh -silent \
    -executeConfigTools \
    -responseFile {{ oracle_gi_responseFile }} \
    2>&1 | tee {{ oracle_stage }}/gi_configtools.log
  become: true
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_BASE: "{{ oracle_base }}"
    CV_ASSUME_DISTID: "{{ cv_assume_distid | default('') }}"
    TMP: "{{ oracle_tmp_dir | default('/u01/tmp') }}"
    TMPDIR: "{{ oracle_tmp_dir | default('/u01/tmp') }}"
  register: gi_configtools
  failed_when:
    - gi_configtools.rc != 0
    - "'Successfully Setup Software' not in gi_configtools.stdout"
  when: not olrloc.stat.exists

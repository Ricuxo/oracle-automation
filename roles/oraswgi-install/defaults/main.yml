---
# Versão do Grid Infrastructure (definida no group_vars)
# Exemplos: 12.2.0.1.0, 19.3.0.0.0, 19.21.0.0.0, 21.3.0.0.0, 23.4.0.0.0, 26.1.0.0.0
oracle_gi_version: "19.3.0.0.0"

# Path do Grid Home calculado automaticamente
# Formato: major.RU.0 (ex: 19.3.0, 21.3.0)
oracle_gi_version_path: "{{ oracle_gi_version.split('.')[0] }}.{{ oracle_gi_version.split('.')[1] }}.{{ oracle_gi_version.split('.')[2] }}.{{ oracle_gi_version.split('.')[3] }}"
oracle_home_gi: "{{ oracle_base }}/{{ oracle_gi_version_path }}/grid"

# Arquivo zip do instalador - deve ser colocado em files/binarios/
# O usuário define o nome do zip no group_vars
oracle_gi_zip_files: []
# Exemplo em group_vars:
# oracle_gi_zip_files:
#   - LINUX.X64_193000_grid_home.zip

# Diretório de stage
oracle_stage: /u01/stage
oracle_rsp_stage: "{{ oracle_stage }}/rsp"

# Response file
oracle_gi_responseFile: "{{ oracle_rsp_stage }}/gi_install.rsp"

# Configurações RAC
oracle_scan: your.scan.address
oracle_scan_port: 1521
oracle_vip: "-vip"
oracle_ic_net: "192.168.100.{{ ansible_all_ipv4_addresses[0].split('.')[-1] }}"

# Diskgroup inicial
# RAC: CRS, SI: DATA
oracle_asm_init_dg: "{% if configure_cluster | bool %}CRS{% else %}DATA{% endif %}"

# Oracle Base do Grid Infrastructure (separado do DB)
oracle_base_gi: "{{ oracle_base }}"

---
configure_cluster: false
asm_disk_management: asmlib
storage_type: asm

# Versão Oracle Database e Grid
oracle_db_version: "19.3.0.0.0"
oracle_gi_version: "19.3.0.0.0"

# Binários
oracle_gi_zip_files:
  - LINUX.X64_193000_grid_home.zip

oracle_db_zip_files:
  - LINUX.X64_193000_db_home.zip

# Disco dedicado para /u01
oracle_disk_u01: /dev/sdb

# Diskgroups ASM
oracle_asm_diskgroups:
  - diskgroup: DATA
    state: present
    properties:
      - { redundancy: EXTERNAL, ausize: 4 }
    attributes:
      - { name: compatible.asm,   value: 19.0.0.0.0 }
      - { name: compatible.rdbms, value: 19.0.0.0.0 }
    disk:
      - { device: /dev/sdc, asmlabel: DATA01 }
  - diskgroup: FRA
    state: present
    properties:
      - { redundancy: EXTERNAL, ausize: 4 }
    attributes:
      - { name: compatible.asm,   value: 19.0.0.0.0 }
      - { name: compatible.rdbms, value: 19.0.0.0.0 }
    disk:
      - { device: /dev/sdd, asmlabel: FRA01 }
